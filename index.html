document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

08, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"18aed47e-502c-47b0-be79-b79f259abd60\"><\u002Fscript>\n<script src=\"a1856acb-2e9f-4cd2-ba96-132e2cfa9f10\"><\u002Fscript>\n<script src=\"9b861211-69b5-4dd1-acad-c477c1b967bf\"><\u002Fscript>\n<style>\n  *{ box-sizing:border-box; }\n  html,body{ margin:0; padding:0; background:#14171a; }\n  input,textarea,select,button{ font-family:inherit; color:inherit; }\n  input[type=date]{ color-scheme:dark; }\n  a{ color:#8fb3d1; } a:hover{ color:#cfe0ee; }\n  *:focus-visible{ outline:2px solid #7fa6c9; outline-offset:1px; }\n  ::selection{ background:rgba(127,166,201,.35); }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"--bg:{{ t.bg }};--sf:{{ t.sf }};--sf2:{{ t.sf2 }};--ln:{{ t.ln }};--tx:{{ t.tx }};--sb:{{ t.sb }};--hl:{{ t.hl }};--sh:{{ t.sh }};background:var(--bg,#14171a);color:var(--tx,#e8ece6);font-family:'Public Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh\">\n\n<sc-if value=\"{{ showBoot }}\">\n  <div style=\"min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--sb,#93a08f);max-width:380px;text-wrap:pretty\">{{ bootLabel }}<\u002Fdiv>\n    <sc-if value=\"{{ bootFailed }}\">\n      <button type=\"button\" sc-camel-on-click=\"{{ reload }}\" style=\"border:1px solid {{ t.hl }};background:transparent;border-radius:8px;padding:9px 16px;cursor:pointer;color:{{ t.hl }};font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em\">Retry<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showGate }}\">\n  <div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px\">\n    <div style=\"width:100%;max-width:400px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--sb,#93a08f)\">Execution tracker<\u002Fdiv>\n      <h1 style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:2rem;font-weight:700;letter-spacing:-.01em;margin:10px 0 12px\">The Weekly Split<\u002Fh1>\n      <p style=\"color:var(--sb,#93a08f);margin:0 0 26px;font-size:.95rem;text-wrap:pretty\">A private tracker for one fixed weekly schedule — training, work, coursework toward a software engineering degree, and the time that stays protected. Sign in to see and record your week; it syncs across your devices.<\u002Fp>\n\n      <div style=\"background:var(--sf,#1e231f);border:1px solid var(--ln,#343b34);border-radius:12px;padding:20px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px\">\n        <label style=\"display:flex;flex-direction:column;gap:5px\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--sb,#93a08f)\">Email<\u002Fspan>\n          <input value=\"{{ email }}\" sc-camel-on-change=\"{{ setEmail }}\" sc-camel-on-key-down=\"{{ onGateKey }}\" type=\"email\" sc-camel-auto-complete=\"username\" style=\"width:100%;border:1px solid var(--ln,#343b34);border-radius:7px;padding:9px 10px;font-size:14px;background:var(--bg,#14171a)\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:5px\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--sb,#93a08f)\">Password<\u002Fspan>\n          <input value=\"{{ password }}\" sc-camel-on-change=\"{{ setPassword }}\" sc-camel-on-key-down=\"{{ onGateKey }}\" type=\"password\" sc-camel-auto-complete=\"current-password\" style=\"width:100%;border:1px solid var(--ln,#343b34);border-radius:7px;padding:9px 10px;font-size:14px;background:var(--bg,#14171a)\">\n        <\u002Flabel>\n\n        <sc-if value=\"{{ authError }}\">\n          <div style=\"font-size:12px;color:{{ t.warm }};text-wrap:pretty\">{{ authError }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <button type=\"button\" sc-camel-on-click=\"{{ signIn }}\" disabled=\"{{ authBusy }}\" style=\"border:1px solid {{ t.hl }};background:transparent;border-radius:8px;padding:10px;cursor:pointer;color:{{ t.hl }};font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:{{ gateOpacity }}\">{{ signInLabel }}<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ signUp }}\" disabled=\"{{ authBusy }}\" style=\"border:none;background:transparent;cursor:pointer;color:var(--sb,#93a08f);font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:2px\">Create an account<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;font-size:11px;color:var(--sb,#93a08f);text-wrap:pretty\">{{ gateNote }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showApp }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"max-width:1320px;margin:0 auto;padding:32px 20px 80px\">\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-end;margin-bottom:16px\">\n    <div>\n      <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--sb,#93a08f)\">Execution tracker · day, week, month<\u002Fspan>\n        <span title=\"{{ syncTitle }}\" style=\"display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:{{ syncColor }};border:1px solid {{ syncColor }};border-radius:999px;padding:2px 8px\">{{ syncLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(1.7rem,3.6vw,2.2rem);font-weight:700;letter-spacing:-.01em;margin:8px 0 10px\">The Weekly Split<\u002Fh1>\n      <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n        <button type=\"button\" sc-camel-on-click=\"{{ prev }}\" style=\"background:var(--sf,#1e231f);border:1px solid var(--ln,#343b34);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--sb,#93a08f)\">‹<\u002Fbutton>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.03em;min-width:215px;text-align:center\">{{ scopeLabel }}<\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"background:var(--sf,#1e231f);border:1px solid var(--ln,#343b34);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--sb,#93a08f)\">›<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ goToday }}\" style=\"background:var(--sf2,#272d27);border:1px solid var(--ln,#343b34);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--sb,#93a08f);font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em\">Today<\u002Fbutton>\n        <div style=\"display:flex;gap:3px;background:var(--sf2,#272d27);border-radius:999px;padding:3px;margin-left:6px\">\n          <sc-for list=\"{{ levels }}\" as=\"lv\" hint-placeholder-count=\"3\">\n            <button type=\"button\" sc-camel-on-click=\"{{ lv.pick }}\" style=\"border:none;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:6px 12px;border-radius:999px;cursor:pointer;background:{{ lv.bg }};color:{{ lv.fg }};font-weight:{{ lv.weight }}\">{{ lv.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--sf,#1e231f);border:1px solid var(--ln,#343b34);border-radius:12px;padding:14px 18px;box-shadow:var(--sh);text-align:right;min-width:215px\">\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums\">{{ pct }}<span style=\"font-size:1.1rem;color:var(--sb,#93a08f)\">%<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--sb,#93a08f)\">{{ doneLabel }}<\u002Fdiv>\n      <div style=\"display:flex;gap:6px;justify-content:flex-end;margin-top:9px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ toggleTheme }}\" title=\"Switch theme\" style=\"background:var(--sf2,#272d27);border:1px solid var(--ln,#343b34);border-radius:7px;padding:6px 10px;cursor:pointer;color:var(--sb,#93a08f);font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em\">{{ themeLabel }}<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ toggleEdit }}\" style=\"background:var(--sf2,#272d27);border:1px solid var(--ln,#343b34);border-radius:7px;padding:6px 10px;cursor:pointer;color:var(--sb,#93a08f);font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em\">{{ editLabel }}<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ resetWeek }}\" style=\"background:var(--sf2,#272d27);border:1px solid var(--ln,#343b34);border-radius:7px;padding:6px 10px;cursor:pointer;color:var(--sb,#93a08f);font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em\">Reset<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:9px;padding-top:9px;border-top:1px solid var(--ln,#343b34)\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--sb,#93a08f);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ userEmail }}<\u002Fspan>\n        <button type=\"button\" sc-camel-on-click=\"{{ signOut }}\" style=\"background:transparent;border:none;cursor:pointer;color:var(--sb,#93a08f);font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;padding:0\">Sign out<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:18px\">\n    <sc-for list=\"{{ legend }}\" as=\"l\" hint-placeholder-count=\"5\">\n      <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sb,#93a08f)\"><i style=\"width:10px;height:10px;border-radius:3px;display:inline-block;background:{{ l.color }}\"><\u002Fi>{{ l.text }}<\u002Fspan>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"position:relative\">\n    <sc-if value=\"{{ showDays }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:grid;gap:12px;align-items:start;grid-template-columns:{{ gridCols }};max-width:{{ gridMax }}\">\n        <sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"7\">\n          <div style=\"background:var(--sf,#1e231f);border:1px solid var(--ln,#343b34);border-radius:12px;padding:{{ d.pad }};display:flex;flex-direction:column;gap:7px;box-shadow:{{ d.shadow }}\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n              <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:{{ d.nameSize }}\">{{ d.name }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--sb,#93a08f);font-variant-numeric:tabular-nums\">{{ d.count }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--sb,#93a08f);margin-bottom:2px\">{{ d.tag }}<\u002Fdiv>\n\n            <sc-for list=\"{{ d.blocks }}\" as=\"b\" hint-placeholder-count=\"8\">\n              <div style=\"display:contents\">\n                <sc-if value=\"{{ b.showToggle }}\">\n                  <div style=\"display:flex;gap:4px;background:var(--sf2,#272d27);border-radius:999px;padding:4px;margin:3px 0 2px\">\n                    <sc-for list=\"{{ d.modes }}\" as=\"m\" hint-placeholder-count=\"2\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ m.pick }}\" style=\"flex:1;border:none;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.03em;padding:6px 4px;border-radius:999px;cursor:pointer;background:{{ m.bg }};color:{{ m.fg }};font-weight:{{ m.weight }}\">{{ m.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"border-radius:0 8px 8px 0;padding:6px 9px;font-size:12px;border-left:3px solid {{ b.bd }};background:{{ b.bg }};opacity:{{ b.op }}\">\n                  <sc-if value=\"{{ b.showFixed }}\">\n                    <div style=\"display:flex;align-items:flex-start;gap:8px\">\n                      <div style=\"flex:1;min-width:0\">\n                        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--sb,#93a08f)\">{{ b.t }}<\u002Fdiv>\n                        <div style=\"font-weight:600;margin-top:1px\">{{ b.label }}<\u002Fdiv>\n                        <sc-if value=\"{{ b.sub }}\"><div style=\"color:var(--sb,#93a08f);font-size:11px;margin-top:1px\">{{ b.sub }}<\u002Fdiv><\u002Fsc-if>\n                      <\u002Fdiv>\n                      <span title=\"Fixed block — not tracked\" style=\"font-family:'IBM Plex Mono',monospace;font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--sb,#93a08f);border:1px solid var(--ln,#343b34);border-radius:4px;padding:1px 4px;white-space:nowrap\">fixed<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ b.showEdit }}\">\n                    <div style=\"display:flex;flex-direction:column;gap:4px\">\n                      <input value=\"{{ b.t }}\" sc-camel-on-change=\"{{ b.setTime }}\" placeholder=\"time\" style=\"width:100%;border:1px solid var(--ln,#343b34);border-radius:5px;padding:3px 5px;font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--bg,#14171a)\">\n                      <input value=\"{{ b.label }}\" sc-camel-on-change=\"{{ b.setLabel }}\" placeholder=\"label\" style=\"width:100%;border:1px solid var(--ln,#343b34);border-radius:5px;padding:3px 5px;font-size:11.5px;font-weight:600;background:var(--bg,#14171a)\">\n                      <div style=\"display:flex;gap:4px\">\n                        <sc-raw-select value=\"{{ b.cat }}\" sc-camel-on-change=\"{{ b.setCat }}\" style=\"flex:1;border:1px solid var(--ln,#343b34);border-radius:5px;padding:3px 4px;font-size:10.5px;background:var(--bg,#14171a)\">\n                          <sc-for list=\"{{ cats }}\" as=\"c\" hint-placeholder-count=\"6\">\n                            <option value=\"{{ c.id }}\">{{ c.name }}<\u002Foption>\n                          <\u002Fsc-for>\n                        <\u002Fsc-raw-select>\n                        <button type=\"button\" sc-camel-on-click=\"{{ b.remove }}\" title=\"Delete block\" style=\"border:1px solid var(--ln,#343b34);background:transparent;border-radius:5px;width:26px;cursor:pointer;color:{{ t.warm }};font-size:12px\">✕<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ b.showTrack }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"display:flex;align-items:flex-start;gap:8px\">\n                      <input type=\"checkbox\" checked=\"{{ b.done }}\" sc-camel-on-change=\"{{ b.toggle }}\" style=\"margin-top:2px;accent-color:{{ t.acc }};cursor:pointer;flex-shrink:0\">\n                      <div style=\"flex:1;min-width:0\">\n                        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--sb,#93a08f)\">{{ b.t }}<\u002Fdiv>\n                        <div style=\"font-weight:600;margin-top:1px;text-decoration:{{ b.strike }}\">{{ b.label }}<\u002Fdiv>\n                        <sc-if value=\"{{ b.sub }}\"><div style=\"color:var(--sb,#93a08f);font-size:11px;margin-top:1px\">{{ b.sub }}<\u002Fdiv><\u002Fsc-if>\n                        <sc-if value=\"{{ b.isStudy }}\">\n                          <div style=\"display:flex;align-items:center;gap:5px;margin-top:5px\">\n                            <input value=\"{{ b.hours }}\" sc-camel-on-change=\"{{ b.setHours }}\" placeholder=\"0\" sc-camel-input-mode=\"decimal\" style=\"width:46px;border:1px solid var(--ln,#343b34);border-radius:5px;padding:2px 5px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:var(--bg,#14171a);text-align:right\">\n                            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--sb,#93a08f)\">hrs logged<\u002Fspan>\n                          <\u002Fdiv>\n                          <sc-raw-select value=\"{{ b.courseId }}\" sc-camel-on-change=\"{{ b.setCourse }}\" style=\"width:100%;margin-top:4px;border:1px solid var(--ln,#343b34);border-radius:5px;padding:2px 4px;font-size:10.5px;background:var(--bg,#14171a);color:var(--sb,#93a08f)\">\n                            <option value=\"\">— toward which course? —<\u002Foption>\n                            <sc-for list=\"{{ courseOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n                              <option value=\"{{ o.id }}\">{{ o.name }}<\u002Foption>\n                            <\u002Fsc-for>\n                          <\u002Fsc-raw-select>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ b.skipped }}\">\n                          <input value=\"{{ b.reason }}\" sc-camel-on-change=\"{{ b.setReason }}\" placeholder=\"why skipped?\" style=\"width:100%;margin-top:5px;border:1px solid var(--ln,#343b34);border-radius:5px;padding:2px 5px;font-size:10.5px;background:var(--bg,#14171a);color:{{ t.warm }}\">\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                      <button type=\"button\" sc-camel-on-click=\"{{ b.toggleSkip }}\" title=\"Mark skipped\" style=\"border:none;background:transparent;cursor:pointer;color:{{ b.skipColor }};font-family:'IBM Plex Mono',monospace;font-size:11px;padding:0 2px;line-height:1.2\">⤫<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <sc-if value=\"{{ editing }}\">\n              <button type=\"button\" sc-camel-on-click=\"{{ d.addBlock }}\" style=\"border:1px dashed var(--ln,#343b34);background:transparent;border-radius:8px;padding:5px;cursor:pointer;color:var(--sb,#93a08f);font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.04em\">+ block<\u002Fbutton>\n            <\u002Fsc-if>\n\n            <div style=\"border-top:1px solid var(--ln,#343b34);margin-top:3px;padding-top:8px;display:flex;flex-direction:column;gap:6px\">\n              <div style=\"display:flex;align-items:center;gap:5px\">\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--sb,#93a08f)\">Energy<\u002Fspan>\n                <sc-for list=\"{{ d.energy }}\" as=\"e\" hint-placeholder-count=\"5\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ e.pick }}\" title=\"{{ e.title }}\" style=\"width:13px;height:13px;border-radius:50%;cursor:pointer;padding:0;border:1px solid var(--ln,#343b34);background:{{ e.bg }}\"><\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <textarea value=\"{{ d.note }}\" sc-camel-on-change=\"{{ d.setNote }}\" placeholder=\"note…\" rows=\"{{ d.noteRows }}\" style=\"width:100%;resize:vertical;border:1px solid var(--ln,#343b34);border-radius:6px;padding:5px 7px;font-size:11.5px;background:var(--bg,#14171a)\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showMonth }}\">\n      <div style=\"background:var(--sf,#1e231f);border:1px solid var(--ln,#343b34);border-radius:12px;padding:14px;box-shadow:var(--sh)\">\n        <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:8px\">\n          <sc-for list=\"{{ dowLabels }}\" as=\"w\" hint-placeholder-count=\"7\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--sb,#93a08f);text-align:center\">{{ w.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px\">\n          <sc-for list=\"{{ monthCells }}\" as=\"c\" hint-placeholder-count=\"35\">\n            <div style=\"border:1px solid {{ c.border }};border-radius:9px;padding:7px 7px 8px;min-height:118px;display:flex;flex-direction:column;gap:5px;background:{{ c.bg }};opacity:{{ c.op }}\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center\">\n                <button type=\"button\" sc-camel-on-click=\"{{ c.open }}\" title=\"Open this day\" style=\"border:none;background:transparent;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-variant-numeric:tabular-nums;padding:0;color:{{ c.numColor }};font-weight:{{ c.numWeight }}\">{{ c.num }}<\u002Fbutton>\n                <div style=\"display:flex;align-items:center;gap:4px\">\n                  <sc-if value=\"{{ c.hasEnergy }}\"><span title=\"{{ c.energyTitle }}\" style=\"width:8px;height:8px;border-radius:50%;background:{{ c.energyColor }};display:inline-block\"><\u002Fspan><\u002Fsc-if>\n                  <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--sb,#93a08f);font-variant-numeric:tabular-nums\">{{ c.count }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ c.deadlines }}\" as=\"dl\" hint-placeholder-count=\"0\">\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:8.5px;text-transform:uppercase;letter-spacing:.04em;border:1px solid {{ t.warm }};color:{{ t.warm }};border-radius:4px;padding:1px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ dl.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display:flex;flex-direction:column;gap:3px;overflow:hidden\">\n                <sc-for list=\"{{ c.blocks }}\" as=\"b\" hint-placeholder-count=\"4\">\n                  <label style=\"display:flex;align-items:center;gap:5px;font-size:9.5px;line-height:1.25;cursor:pointer;border-left:2px solid {{ b.bd }};padding-left:5px;opacity:{{ b.op }}\">\n                    <input type=\"checkbox\" checked=\"{{ b.done }}\" sc-camel-on-change=\"{{ b.toggle }}\" style=\"accent-color:{{ t.acc }};width:11px;height:11px;cursor:pointer;flex-shrink:0;margin:0\">\n                    <span style=\"min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:{{ b.strike }}\">{{ b.label }}<\u002Fspan>\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:40px\">\n    <div style=\"margin-bottom:14px\">\n      <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:1.35rem;font-weight:700;margin:0 0 5px\">Habits<\u002Fh2>\n      <p style=\"color:var(--sb,#93a08f);margin:0;font-size:.95rem\">Eight completed weeks plus the one in progress, faded at the right. Verdicts compare the last four completed weeks to the four before. Set each habit's weekly bar to drive its streak.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid {{ warnBorder }};background:{{ warnBg }};border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:{{ warnColor }}\">{{ warnLabel }}<\u002Fspan>\n      <span style=\"font-size:12.5px;color:{{ warnColor }}\">{{ warningText }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"background:{{ energyBg }};border:1px solid {{ energyBorder }};border-radius:12px;padding:14px 16px;box-shadow:var(--sh);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:18px;align-items:center\">\n      <div style=\"min-width:150px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:{{ energyColor }};margin-bottom:4px\">{{ energyLabel }}<\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:5px\">\n          <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:1.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:{{ energyColor }}\">{{ energyAvgLabel }}<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--sb,#93a08f)\">avg / 5 · 14 days<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:4px;height:42px;flex:1;min-width:200px\">\n        <sc-for list=\"{{ energyBars }}\" as=\"e\" hint-placeholder-count=\"14\">\n          <div sc-camel-on-click=\"{{ e.go }}\" title=\"{{ e.title }}\" style=\"flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%\">\n            <div style=\"width:100%;border-radius:2px 2px 0 0;height:{{ e.h }};background:{{ e.bg }};opacity:{{ e.op }}\"><\u002Fdiv>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:7.5px;color:var(--sb,#93a08f)\">{{ e.dow }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:240px;font-size:12.5px;color:{{ energyColor }};text-wrap:pretty\">{{ energyText }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:12px\">\n      <sc-for list=\"{{ habitCards }}\" as=\"h\" hint-placeholder-count=\"8\">\n        <div style=\"background:{{ h.cardBg }};border:1px solid {{ h.cardBorder }};border-radius:12px;padding:14px 15px 13px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:11px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:8px\">\n            <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:1.05rem;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ h.name }}<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;color:{{ h.tone }};border:1px solid {{ h.tone }};border-radius:999px;padding:2px 7px;white-space:nowrap\">{{ h.statusLabel }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:flex-end;gap:16px\">\n            <div style=\"display:flex;align-items:baseline;gap:5px\">\n              <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:1.9rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:{{ h.tone }}\">{{ h.avgLabel }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--sb,#93a08f)\">{{ h.avgUnit }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"position:relative;flex:1;display:flex;align-items:flex-end;gap:3px;height:44px\">\n              <div style=\"position:absolute;left:0;right:0;top:{{ h.barLine }};border-top:1px dashed var(--ln,#343b34)\">\n                <span title=\"Weekly bar\" style=\"position:absolute;right:0;top:-5px;background:{{ h.cardBg }};padding:0 3px;font-family:'IBM Plex Mono',monospace;font-size:8px;line-height:1.2;color:var(--sb,#93a08f);font-variant-numeric:tabular-nums\">{{ h.barTick }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ h.bars }}\" as=\"b\" hint-placeholder-count=\"8\">\n                <div sc-camel-on-click=\"{{ b.go }}\" title=\"{{ b.title }}\" style=\"flex:1;min-width:0;cursor:pointer;display:flex;align-items:flex-end;height:100%\">\n                  <div style=\"width:100%;border-radius:2px 2px 0 0;height:{{ b.h }};background:{{ b.bg }};opacity:{{ b.op }}\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font-size:12.5px;color:var(--tx,#e8ece6);text-wrap:pretty\">{{ h.verdict }}<\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--ln,#343b34);padding-top:10px\">\n            <div style=\"display:flex;align-items:baseline;gap:5px\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;font-variant-numeric:tabular-nums;color:{{ h.streakColor }}\">{{ h.streakLabel }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--sb,#93a08f)\">streak · {{ h.bestLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:{{ h.thisWeekColor }};margin-left:auto\">{{ h.thisWeekLabel }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;gap:7px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--sb,#93a08f)\">Weekly bar<\u002Fspan>\n            <input value=\"{{ h.barValue }}\" sc-camel-on-change=\"{{ h.setBar }}\" sc-camel-input-mode=\"numeric\" style=\"width:40px;border:1px solid var(--ln,#343b34);border-radius:5px;padding:2px 5px;font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--bg,#14171a);text-align:right\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--sb,#93a08f)\">{{ h.unit }} / wk<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:28px;max-width:520px\">\n      <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:1.35rem;font-weight:700;margin:0 0 16px\">This week by category<\u002Fh2>\n      <div style=\"background:var(--sf,#1e231f);border:1px solid var(--ln,#343b34);border-radius:12px;padding:6px 16px 10px;box-shadow:var(--sh)\">\n        <sc-for list=\"{{ totals }}\" as=\"tt\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln,#343b34)\">\n            <span style=\"flex:1;font-size:12.5px;font-weight:600\">{{ tt.name }}<\u002Fspan>\n            <div style=\"flex:2;height:6px;border-radius:3px;background:var(--sf2,#272d27);overflow:hidden\">\n              <div style=\"height:100%;border-radius:3px;width:{{ tt.w }};background:{{ tt.color }}\"><\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--sb,#93a08f);font-variant-numeric:tabular-nums;min-width:44px;text-align:right\">{{ tt.count }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:44px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;margin-bottom:16px\">\n      <div>\n        <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:1.35rem;font-weight:700;margin:0 0 5px\">BS Software Engineering — Western Governors University<\u002Fh2>\n        <p style=\"color:var(--sb,#93a08f);margin:0;font-size:.95rem\">{{ degreeSummary }}<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--sb,#93a08f)\">Weekly target<\u002Fspan>\n        <input value=\"{{ weeklyTarget }}\" sc-camel-on-change=\"{{ setTarget }}\" sc-camel-input-mode=\"decimal\" style=\"width:52px;border:1px solid var(--ln,#343b34);border-radius:6px;padding:4px 6px;font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--sf,#1e231f);text-align:right\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--sb,#93a08f)\">hrs<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:14px\">\n      <div style=\"background:var(--sf,#1e231f);border:1px solid var(--ln,#343b34);border-radius:12px;padding:16px;box-shadow:var(--sh)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px\">\n          <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums\">{{ degreeCount }}<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--sb,#93a08f)\">{{ degreePctLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:8px;border-radius:4px;background:var(--sf2,#272d27);overflow:hidden\">\n          <div style=\"height:100%;border-radius:4px;width:{{ degreeW }};background:{{ t.acc }}\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin-top:12px\">\n          <sc-for list=\"{{ pips }}\" as=\"p\" hint-placeholder-count=\"39\">\n            <div title=\"{{ p.title }}\" style=\"height:9px;border-radius:2px;background:{{ p.bg }}\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--sf,#1e231f);border:1px solid var(--ln,#343b34);border-radius:12px;padding:16px;box-shadow:var(--sh)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px\">\n          <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums\">{{ paceLabel }}<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--sb,#93a08f)\">{{ paceNote }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:8px;border-radius:4px;background:var(--sf2,#272d27);overflow:hidden\">\n          <div style=\"height:100%;border-radius:4px;width:{{ paceW }};background:{{ paceFill }}\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--sb,#93a08f);margin-top:12px\">{{ totalHoursLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--sf,#1e231f);border:1px solid var(--ln,#343b34);border-radius:12px;box-shadow:var(--sh);overflow:hidden\">\n      <div style=\"display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--ln,#343b34)\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--sb,#93a08f);flex:1\">Courses — rename as you enroll<\u002Fspan>\n        <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"3\">\n          <button type=\"button\" sc-camel-on-click=\"{{ f.pick }}\" style=\"border:1px solid {{ f.border }};background:transparent;border-radius:999px;padding:4px 10px;cursor:pointer;color:{{ f.fg }};font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em\">{{ f.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"max-height:420px;overflow:auto\">\n        <sc-for list=\"{{ courseRows }}\" as=\"c\" hint-placeholder-count=\"10\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--ln,#343b34);opacity:{{ c.op }}\">\n            <input type=\"checkbox\" checked=\"{{ c.done }}\" sc-camel-on-change=\"{{ c.toggle }}\" title=\"Mark class completed\" style=\"accent-color:{{ t.acc }};cursor:pointer;flex-shrink:0\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--sb,#93a08f);font-variant-numeric:tabular-nums;width:22px\">{{ c.num }}<\u002Fspan>\n            <input value=\"{{ c.name }}\" sc-camel-on-change=\"{{ c.setName }}\" placeholder=\"Course name\" style=\"flex:1;min-width:0;border:none;background:transparent;font-size:12.5px;font-weight:600;text-decoration:{{ c.strike }}\">\n            <input type=\"date\" value=\"{{ c.due }}\" sc-camel-on-change=\"{{ c.setDue }}\" title=\"Target completion date\" style=\"border:1px solid var(--ln,#343b34);border-radius:5px;padding:2px 5px;font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--bg,#14171a);color:var(--sb,#93a08f)\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:{{ c.dueColor }};min-width:76px;text-align:right\">{{ c.dueNote }}<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:{{ t.warm }};font-variant-numeric:tabular-nums;min-width:52px;text-align:right\">{{ c.hours }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasCompleted }}\">\n      <div style=\"margin-top:22px\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:10px\">\n          <h3 style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:1.05rem;font-weight:700;margin:0\">Completed classes<\u002Fh3>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--sb,#93a08f)\">{{ completedLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:var(--sf,#1e231f);border:1px solid var(--ln,#343b34);border-radius:12px;padding:4px 16px 8px;box-shadow:var(--sh)\">\n          <sc-for list=\"{{ completed }}\" as=\"c\" hint-placeholder-count=\"1\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln,#343b34)\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--sb,#93a08f);font-variant-numeric:tabular-nums\">{{ c.num }}<\u002Fspan>\n              <span style=\"flex:1;min-width:0;font-size:12.5px;font-weight:600\">{{ c.name }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:{{ t.acc }}\">{{ c.when }}<\u002Fspan>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:{{ t.warm }};font-variant-numeric:tabular-nums;min-width:56px;text-align:right\">{{ c.hours }}<\u002Fspan>\n              <button type=\"button\" sc-camel-on-click=\"{{ c.restore }}\" title=\"Move back to in progress\" style=\"border:1px solid var(--ln,#343b34);background:transparent;border-radius:6px;padding:3px 7px;cursor:pointer;color:var(--sb,#93a08f);font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em\">Reopen<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:44px\">\n    <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:1.35rem;font-weight:700;margin:0 0 5px\">Open items<\u002Fh2>\n    <p style=\"color:var(--sb,#93a08f);margin:0 0 16px;font-size:.95rem\">The gaps in the schedule, as things to actually decide.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px\">\n      <sc-for list=\"{{ todos }}\" as=\"td\" hint-placeholder-count=\"5\">\n        <div style=\"background:var(--sf,#1e231f);border:1px solid var(--ln,#343b34);border-radius:12px;padding:13px 14px;box-shadow:var(--sh);display:flex;gap:8px;align-items:flex-start;opacity:{{ td.op }}\">\n          <input type=\"checkbox\" checked=\"{{ td.done }}\" sc-camel-on-change=\"{{ td.toggle }}\" style=\"margin-top:3px;accent-color:{{ t.acc }};cursor:pointer;flex-shrink:0\">\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--sb,#93a08f);margin-bottom:4px\">{{ td.num }}<\u002Fdiv>\n            <div style=\"font-weight:600;font-size:12.5px;text-decoration:{{ td.strike }}\">{{ td.text }}<\u002Fdiv>\n            <div style=\"color:var(--sb,#93a08f);font-size:11.5px;margin-top:4px\">{{ td.detail }}<\u002Fdiv>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ td.remove }}\" title=\"Remove\" style=\"border:none;background:transparent;cursor:pointer;color:var(--sb,#93a08f);font-size:11px;padding:0 2px\">✕<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"border:1px dashed var(--ln,#343b34);border-radius:12px;padding:13px 14px;display:flex;align-items:center\">\n        <input value=\"{{ draft }}\" sc-camel-on-change=\"{{ setDraft }}\" sc-camel-on-key-down=\"{{ addTodo }}\" placeholder=\"Add an item, press Enter\" style=\"width:100%;border:none;background:transparent;font-size:12.5px\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:36px;padding-top:14px;border-top:1px solid var(--ln,#343b34);font-size:11px;color:var(--sb,#93a08f)\">{{ footer }}<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n  \n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst THEMES = {\n  dark: {bg:'#14171a', sf:'#1d2221', sf2:'#272d2c', ln:'#343b3a', tx:'#e8ece6', sb:'#8e9a92',\n    hl:'#7fae8d', acc:'#7fae8d', warm:'#d29a6e', hlRgb:'127,174,141', warmRgb:'210,154,110', sh:'0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28)',\n    cats:{plain:{bd:'#3c4443',bg:'rgba(255,255,255,.02)'}, train:{bd:'#7fae8d',bg:'rgba(127,174,141,.12)'},\n      work:{bd:'#7fa6c9',bg:'rgba(127,166,201,.12)'}, study:{bd:'#d29a6e',bg:'rgba(210,154,110,.13)'},\n      social:{bd:'#c08bb0',bg:'rgba(192,139,176,.12)'}, flex:{bd:'#c4b477',bg:'rgba(196,180,119,.12)'}}},\n  light: {bg:'#eef0ea', sf:'#ffffff', sf2:'#e2e6da', ln:'#cdd3c1', tx:'#1b2019', sb:'#5c6459',\n    hl:'#3f5d4a', acc:'#3f5d4a', warm:'#7a4a2e', hlRgb:'63,93,74', warmRgb:'122,74,46', sh:'0 1px 2px rgba(20,24,16,.06), 0 6px 18px rgba(20,24,16,.06)',\n    cats:{plain:{bd:'#cdd3c1',bg:'transparent'}, train:{bd:'#3f5d4a',bg:'#e3ebe1'},\n      work:{bd:'#35516b',bg:'#e2eaf0'}, study:{bd:'#7a4a2e',bg:'#f1e6dc'},\n      social:{bd:'#6b3f5c',bg:'#efe1ea'}, flex:{bd:'#8a7a3f',bg:'#f0ead9'}}}\n};\nconst HABITS = [\n  {id:'gym', name:'Gym', unit:'sessions', bar:4, test: bl => /^gym/i.test(bl.label)},\n  {id:'bjj', name:'BJJ', unit:'sessions', bar:4, test: bl => /bjj/i.test(bl.label)},\n  {id:'walk', name:'Lunch walk', unit:'walks', bar:4, test: bl => /lunch walk/i.test(bl.label)},\n  {id:'yoga', name:'Stretch / yoga', unit:'sessions', bar:2, test: bl => /stretch|yoga/i.test(bl.label)},\n  {id:'study', name:'Coursework', unit:'blocks', bar:2, test: bl => bl.cat === 'study'},\n  {id:'her', name:'Her / friends', unit:'blocks', bar:3, test: bl => bl.cat === 'social'},\n  {id:'chores', name:'Errands / chores', unit:'runs', bar:2, test: bl => /groceries|chores/i.test(bl.label)},\n  {id:'wind', name:'Wind down', unit:'nights', bar:4, test: bl => /wind down/i.test(bl.label)}\n];\nconst CATNAME = {plain:'Routine', train:'Train', work:'Work', study:'Coursework', social:'Her / friends', flex:'Errands / wind-down'};\nconst DNAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];\nconst DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];\nconst TOTAL_COURSES = 39;\n\nfunction b(id,t,label,cat,sub,extra){ return Object.assign({id:id,t:t,label:label,cat:cat,sub:sub||''}, extra||{}); }\nconst MORNING = function(p,g){ return [\n  b(p+'a','6:30','Wake, get ready','plain'),\n  b(p+'b','7:00–8:45','Gym — '+g+' split + cardio','train'),\n  b(p+'c','8:45–9:00','Home','plain'),\n  b(p+'-work','9:00–5:00','Work','work','fixed block — not tracked',{fixed:true}),\n  b(p+'e','12:00–1:00','Lunch walk outside','train','chase the 10k')\n];};\nconst DEFAULT_SCHEDULE = [\n  {id:'mon', tag:'Must-go BJJ', blocks: MORNING('mon','upper').concat([\n    b('mon-g','5:00–6:00','Dinner, head to BJJ','plain'),\n    b('mon-h','6:00–7:00','BJJ — Gi Fundamentals','train'),\n    b('mon-i','7:00–8:00','BJJ — Gi Advanced','train'),\n    b('mon-j','8:30–10:30','Wind down','flex')])},\n  {id:'tue', tag:'Groceries + pressure valve', blocks: MORNING('tue','lower').concat([\n    b('tue-g','5:00–5:45','Groceries','flex','weekly run'),\n    b('tue-h','5:45–6:15','Dinner','plain'),\n    b('tue-i','6:15–8:30','Open — study catch-up or her','study','the one weeknight with real slack'),\n    b('tue-j','8:30–10:30','Wind down','flex')])},\n  {id:'wed', tag:'Swappable — pick tonight\\u2019s mode', modes:[{id:'bjj',label:'Gi Fundamentals'},{id:'rest',label:'Rest / study'}],\n    blocks: MORNING('wed','upper').concat([\n    b('wed-g','5:00–6:00','Dinner, head to BJJ','plain',null,{mode:'bjj'}),\n    b('wed-h','6:00–7:00','BJJ — Gi Fundamentals','train',null,{mode:'bjj'}),\n    b('wed-i','7:30–10:30','Wind down','flex',null,{mode:'bjj'}),\n    b('wed-j','5:00–6:00','Dinner, easy evening','flex',null,{mode:'rest'}),\n    b('wed-k','6:00–8:00','Study catch-up, or just rest','study',null,{mode:'rest'})])},\n  {id:'thu', tag:'Must-go BJJ', blocks: MORNING('thu','lower').concat([\n    b('thu-g','5:00–5:30','Dinner, head to BJJ','plain'),\n    b('thu-h','6:00–7:30','BJJ — Positional Sparring','train'),\n    b('thu-i','8:00–10:30','Wind down','flex','shortest BJJ night')])},\n  {id:'fri', tag:'Must-go BJJ · zero school work', blocks:[\n    b('fri-a','6:30–7:00','Wake, easier morning','plain'),\n    b('fri-b','7:00–7:45','Stretch / yoga','train'),\n    b('fri-c','9:00–5:00','Work','work','no coursework today — not even in the gaps',{fixed:true}),\n    b('fri-d','5:00–6:00','Dinner, head to BJJ','plain'),\n    b('fri-e','6:00–7:00','BJJ — No-Gi Takedowns','train'),\n    b('fri-f','7:00–8:00','BJJ — No-Gi Advanced','train'),\n    b('fri-g','8:00–9:00','BJJ — No-Gi Open Mat','train'),\n    b('fri-h','9:30 on','Home, wind down','flex','no early alarm — Saturday\\u2019s a sleep-in')]},\n  {id:'sat', tag:'Hers — sleep in, no agenda', blocks:[\n    b('sat-a','Sleep in','No fixed wake time','social'),\n    b('sat-b','All day','Her — rest and whatever\\u2019s mentally fun','social'),\n    b('sat-c','reserve','Recovery day','flex','absorbs Friday\\u2019s late finish — that\\u2019s the point')]},\n  {id:'sun', tag:'Rest, her, coursework, football', blocks:[\n    b('sun-a','Morning','Stretch / yoga, slow start','train'),\n    b('sun-b','Football window','Coursework block','study','alongside her — football on, she\\u2019s crafting'),\n    b('sun-c','Evening','Chores','flex','between study blocks and games'),\n    b('sun-d','Late evening','Wind down, set up the week','social')]}\n];\nconst DEFAULT_TODOS = [\n  {id:'t1', text:'Set a Sunday-night cutoff for study and chores', detail:'Sunday Night Football runs past 11, right before Monday\\u2019s 6:30 alarm and a must-go BJJ night.', done:false},\n  {id:'t2', text:'Give meal prep a home in the week', detail:'Four gym mornings and four BJJ nights is real fuel demand. Stack it after Tuesday\\u2019s grocery run, or thread it through like laundry.', done:false},\n  {id:'t3', text:'Decide which flex valve the week needs', detail:'Tuesday and Wednesday can both bend toward study or rest. Leaning on both in one week is a sign the pace needs a look.', done:false},\n  {id:'t4', text:'Re-run the coursework math before WGU starts', detail:'~6–7 hrs/week now; ~9–15 hrs/week at WGU. Every Sunday being a full study day is the consistency that needs.', done:false},\n  {id:'t5', text:'Protect the Saturday sleep-in', detail:'Saturday is both time with her and the day that absorbs Friday\\u2019s late finish. An early Saturday makes Friday\\u2019s 9pm finish much less forgiving.', done:false}\n];\nfunction seedCourses(){\n  const out = [];\n  for (let i = 1; i <= TOTAL_COURSES; i++) out.push({id:'c'+i, name:'Course ' + String(i).padStart(2,'0'), due:'', done:false});\n  return out;\n}\n\nfunction migrate(schedule){\n  return schedule.map(day => {\n    const at = day.blocks.findIndex(x => x.cat === 'work');\n    if (at < 0) return day;\n    const rest = day.blocks.filter(x => x.cat !== 'work');\n    const sub = day.id === 'fri' ? 'no coursework today — not even in the gaps' : 'fixed block — not tracked';\n    rest.splice(at, 0, {id: day.id + '-work', t: '9:00–5:00', label: 'Work', cat: 'work', sub: sub, fixed: true});\n    return Object.assign({}, day, {blocks: rest});\n  });\n}\n\nconst FB_CONFIG = {\n  apiKey: \"AIzaSyDkaTBKX8nMNRsjs7vpRt8aWhJCQeEMj6g\",\n  authDomain: \"weekly-habit-tracker-bd362.firebaseapp.com\",\n  projectId: \"weekly-habit-tracker-bd362\",\n  storageBucket: \"weekly-habit-tracker-bd362.firebasestorage.app\",\n  messagingSenderId: \"746183546022\",\n  appId: \"1:746183546022:web:f121ae371e33f5bba79067\"\n};\nconst SYNCED = ['schedule','weeks','todos','courses','weeklyTarget','theme','bars'];\nconst CLIENT_ID = Math.random().toString(36).slice(2, 10);\nconst AUTH_MSG = {\n  'auth/invalid-email': 'That email address doesn\\u2019t look right.',\n  'auth/missing-password': 'Enter your pas
