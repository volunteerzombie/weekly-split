state = 'slipping'; verdict = 'Down from ' + p + ' to ' + r + ' ' + def.unit + ' a week.'; }\n          else if (delta >= 0.5) { state = 'climbing'; verdict = 'Up from ' + p + ' to ' + r + ' ' + def.unit + ' a week.'; }\n          else { state = 'holding'; verdict = 'Holding at ' + r + ' ' + def.unit + ' a week.'; }\n        }\n      }\n      const tone = state === 'slipping' ? T.warm\n        : (state === 'climbing' || state === 'holding' || state === 'restart' ? T.hl : T.sb);\n      // Headroom above the bar so its reference line never pins to the plot's top edge.\n      const peak = Math.max(bar * 1.25, 1, ...series.map(s => s.n || 0));\n\n      return {\n        id: def.id, name: def.name, unit: def.unit, state: state,\n        order: state === 'slipping' ? 0 : (state === 'quiet' ? 1 : (state === 'nodata' ? 4 : (state === 'new' || state === 'restart' ? 3 : 2))),\n        verdict: verdict, tone: tone,\n        everDone: everDone,\n        statusLabel: {slipping:'Slipping', climbing:'Climbing', holding:'Holding',\n          'new':'Too early', restart:'Restarting', quiet:'Gone quiet', nodata:'No data'}[state],\n        cardBorder: state === 'slipping' ? T.warm : T.ln,\n        cardBg: state === 'slipping' ? 'rgba(' + T.warmRgb + ',0.06)' : T.sf,\n        avgLabel: rAvg == null ? '—' : round1b(rAvg) + '',\n        avgUnit: rAvg == null ? '' : 'avg / wk',\n        barValue: String(bar),\n        setBar: e => { const v = e.target.value; const bars = Object.assign({}, st.bars); bars[def.id] = v; this.persist({bars: bars}); },\n        streakLabel: streak + (streak === 1 ? ' wk' : ' wks'),\n        streakColor: streak > 0 ? T.hl : T.sb,\n        bestLabel: 'best ' + best,\n        thisWeekLabel: thisWeekN + ' of ' + bar + ' this week',\n        thisWeekColor: bar > 0 && thisWeekN >= bar ? T.hl : T.sb,\n        bars: series.map(s => ({\n          h: Math.max(3, Math.round((s.n || 0) / peak * 100)) + '%',\n          bg: s.n == null ? T.sf2 : (bar > 0 && s.n >= bar ? T.hl : 'rgba(' + T.warmRgb + ',0.55)'),\n          op: s.current ? 0.45 : 1,\n          title: def.name + ' — week of ' + fmt(s.date) + (s.n == null ? ': no data' : ': ' + s.n + ' ' + unit(s.n)) + (s.current ? ' (in progress)' : ''),\n          go: () => this.setState({level: 1, cursor: s.key})\n        })),\n        barLine: bar > 0 ? (100 - Math.round(bar / peak * 100)) + '%' : '-20px',\n        barTick: bar > 0 ? String(bar) : ''\n      };\n    }).sort((a, b) => a.order - b.order);\n\n    // Energy watch: last 14 days, newest last. Streak = consecutive logged days under 3.\n    const DAYIDS = ['mon','tue','wed','thu','fri','sat','sun'];\n    const energyDays = [];\n    for (let i = 13; i >= 0; i--) {\n      const d = addDays(today, -i);\n      const wk = this.state.weeks[iso(mondayOf(d))];\n      const v = wk && wk.energy ? (wk.energy[DAYIDS[(d.getDay()+6)%7]] || 0) : 0;\n      energyDays.push({date: d, v: v, iso: iso(d)});\n    }\n    // Skip trailing unlogged days — energy is rated at day's end, so today is usually blank.\n    let cur = energyDays.length - 1;\n    while (cur >= 0 && !energyDays[cur].v) cur--;\n    let lowStreak = 0;\n    for (let i = cur; i >= 0; i--) {\n      const v = energyDays[i].v;\n      if (!v) break;\n      if (v < 3) lowStreak++; else break;\n    }\n    const lastLogged = cur >= 0 ? energyDays[cur] : null;\n    const staleDays = lastLogged ? Math.round((today - lastLogged.date) / 86400000) : 0;\n    const loggedRecent = energyDays.filter(d => d.v > 0);\n    const energyAvg = loggedRecent.length ? Math.round(loggedRecent.reduce((a, b) => a + b.v, 0) / loggedRecent.length * 10) / 10 : null;\n    const restDue = lowStreak > 3;\n    const energyBars = energyDays.map(d => ({\n      h: d.v ? Math.round(d.v / 5 * 100) + '%' : '14%',\n      bg: !d.v ? T.sf2 : (d.v < 3 ? T.warm : T.hl),\n      op: d.v ? 1 : 0.85,\n      dow: d.date.toLocaleDateString(undefined,{weekday:'narrow'}),\n      title: d.date.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'}) + (d.v ? ' — energy ' + d.v + '/5' : ' — not logged'),\n      go: () => this.setState({level: 0, dayCursor: d.iso})\n    }));\n    const asOf = staleDays > 1 ? ' As of ' + fmt(lastLogged.date) + ', the last day you rated.' : '';\n    const energyText = restDue\n      ? 'Energy has been under 3 for ' + lowStreak + ' days running. Take the day off and rest — the schedule will absorb it.' + asOf\n      : (lowStreak > 0\n        ? lowStreak + (lowStreak === 1 ? ' day' : ' days') + ' under 3 in a row. A fourth calls for a rest day.' + asOf\n        : (energyAvg == null ? 'No energy logged in the last two weeks. Rate a day from its card to start the watch.'\n          : 'Averaging ' + energyAvg + ' of 5 over the last two weeks. Last rated day was 3 or better.'));\n\n    // Banner is a tally of the cards' own states, so it can never claim more than they show.\n    const byState = {};\n    habitCards.forEach(c => { byState[c.state] = (byState[c.state] || []).concat([c.name]); });\n    const nOf = k => (byState[k] || []).length;\n    const slipping = byState.slipping || [];\n    const n = habitCards.length;\n    const has = k => nOf(k) === 1 ? byState[k][0] + ' has' : nOf(k) + ' have';\n    const is = k => nOf(k) === 1 ? byState[k][0] + ' is' : nOf(k) + ' are';\n    const clauses = [];\n    if (nOf('slipping')) clauses.push(slipping.join(', ') + (slipping.length === 1 ? ' has' : ' have') + ' dropped half a session a week or more against the prior month');\n    if (nOf('nodata') === n) clauses.push('nothing is on the chart yet — the week in progress is shown but not counted until it ends');\n    else {\n      if (nOf('quiet')) clauses.push(has('quiet') + ' gone quiet');\n      if (nOf('nodata')) clauses.push(has('nodata') + ' never been completed');\n      if (nOf('restart')) clauses.push(is('restart') + ' restarting this week');\n      if (nOf('new')) clauses.push((nOf('new') === 1 ? byState['new'][0] + ' needs' : nOf('new') + ' need') + ' another month before a trend reads');\n    }\n    const allClear = n > 0 && habitCards.every(c => c.state === 'holding' || c.state === 'climbing');\n    const warningText = allClear\n      ? 'Every habit is holding or climbing against its own prior month.'\n      : (clauses.length ? clauses.join('; ').replace(/^./, s => s.toUpperCase()) + '.'\n        : nOf('holding') + nOf('climbing') + ' of ' + n + ' habits are holding or climbing.');\n\n    const courseHours = {}; let allHours = 0;\n    Object.keys(st.weeks).forEach(k => {\n      const wk = st.weeks[k];\n      Object.keys(wk.hours || {}).forEach(bid => {\n        const h = parseFloat(wk.hours[bid]) || 0; allHours += h;\n        const cid = (wk.courseOf || {})[bid]; if (cid) courseHours[cid] = (courseHours[cid] || 0) + h;\n      });\n    });\n    const today0 = new Date(); today0.setHours(0,0,0,0);\n    const doneCourses = st.courses.filter(c => c.done).length;\n\n    const rows = st.courses.filter(c => st.filter === 'all' ? !c.done : (st.filter === 'dated' ? (!c.done && c.due) : (!c.done && !c.due)));\n    const courseRows = rows.map(c => {\n      const h = round1(courseHours[c.id] || 0);\n      let dueNote = '—', dueColor = T.sb;\n      if (c.due) {\n        const days2 = Math.round((parse(c.due) - today0) / 86400000);\n        if (days2 < 0) { dueNote = Math.abs(days2) + 'd overdue'; dueColor = T.warm; }\n        else if (days2 === 0) { dueNote = 'due today'; dueColor = T.warm; }\n        else { dueNote = days2 + 'd left'; dueColor = days2 <= 14 ? T.warm : T.sb; }\n      }\n      return {num: String(st.courses.indexOf(c) + 1).padStart(2,'0'), name: c.name, due: c.due || '',\n        done: false, op: 1, strike: 'none', hours: h ? h + ' hrs' : '', dueNote: dueNote, dueColor: dueColor,\n        toggle: () => this.persist({courses: st.courses.map(x => x.id === c.id ? Object.assign({}, x, {done:true, completedOn: todayIso}) : x)}),\n        setName: e => { const v = e.target.value; this.persist({courses: st.courses.map(x => x.id === c.id ? Object.assign({}, x, {name:v}) : x)}); },\n        setDue: e => { const v = e.target.value; this.persist({courses: st.courses.map(x => x.id === c.id ? Object.assign({}, x, {due:v}) : x)}); }};\n    });\n    const completed = st.courses.filter(c => c.done).map((c, i) => ({\n      num: String(i + 1).padStart(2,'0'), name: c.name,\n      hours: (round1(courseHours[c.id] || 0) || 0) + ' hrs',\n      when: c.completedOn ? 'completed ' + fmt(parse(c.completedOn)) : 'completed',\n      restore: () => this.persist({courses: st.courses.map(x => x.id === c.id ? Object.assign({}, x, {done:false, completedOn:null}) : x)})\n    }));\n\n    const target = parseFloat(st.weeklyTarget) || 0, loggedH = round1(hours);\n    const filterDefs = [{id:'all',label:'In progress'},{id:'dated',label:'Dated'},{id:'undated',label:'No date'}];\n\n    const SYNCTXT = {\n      idle: ['Offline', T.sb, 'Not signed in.'],\n      loading: ['Loading', T.sb, 'Fetching your data from Firebase.'],\n      saving: ['Saving', T.warm, 'Writing your change to Firebase.'],\n      synced: ['Synced', T.hl, 'Up to date across your devices.'],\n      error: ['Sync error', T.warm, st.syncError || 'Could not reach Firebase.']\n    };\n    const sync = SYNCTXT[st.syncState] || SYNCTXT.idle;\n\n    return {\n      showBoot: st.auth === 'boot' || st.auth === 'error',\n      bootLabel: st.auth === 'error' ? (st.syncError || 'Firebase unavailable') : 'Connecting…',\n      bootFailed: st.auth === 'error',\n      reload: () => window.location.reload(),\n      showGate: st.auth === 'out',\n      showApp: st.auth === 'in',\n      email: st.email, password: st.password,\n      setEmail: e => this.setState({email: e.target.value}),\n      setPassword: e => this.setState({password: e.target.value}),\n      onGateKey: e => { if (e.key === 'Enter') this.signIn(); },\n      signIn: () => this.signIn(),\n      signUp: () => this.signUp(),\n      signOut: () => this.auth.signOut(),\n      authError: st.authError,\n      authBusy: st.authBusy,\n      gateOpacity: st.authBusy ? 0.5 : 1,\n      signInLabel: st.authBusy ? 'Working…' : 'Sign in',\n      gateNote: 'Your data is stored in your Firebase project and tied to your account. Nothing is kept in this page.',\n      userEmail: st.user ? st.user.email : '',\n      syncLabel: sync[0], syncColor: sync[1], syncTitle: sync[2],\n      t: T, themeLabel: st.theme === 'dark' ? 'Light' : 'Dark',\n      toggleTheme: () => this.persist({theme: st.theme === 'dark' ? 'light' : 'dark'}),\n      editing: editing, notEditing: !editing,\n      editLabel: editing ? 'Done' : 'Edit',\n      toggleEdit: () => this.setState({editing: !editing}),\n      levels: [{id:0,label:'Day'},{id:1,label:'Week'},{id:2,label:'Month'}].map(l => ({\n        label: l.label, bg: st.level === l.id ? T.sf : 'transparent',\n        fg: st.level === l.id ? T.tx : T.sb, weight: st.level === l.id ? 600 : 400,\n        pick: () => this.setLevel(l.id)\n      })),\n      showDays: !showMonth, showMonth: showMonth, days: days, monthCells: monthCells,\n      dowLabels: DOW.map(d => ({label: d})),\n      gridCols: st.level === 0 ? '1fr' : 'repeat(auto-fit,minmax(200px,1fr))',\n      gridMax: st.level === 0 ? '620px' : 'none',\n      scopeLabel: scopeLabel,\n      prev: () => { if (st.level === 0) this.setState({dayCursor: iso(addDays(parse(st.dayCursor), -1))});\n        else if (st.level === 1) this.setState({cursor: iso(addDays(monday, -7))});\n        else { const m = parse(st.monthCursor); this.setState({monthCursor: iso(new Date(m.getFullYear(), m.getMonth() - 1, 1))}); } },\n      next: () => { if (st.level === 0) this.setState({dayCursor: iso(addDays(parse(st.dayCursor), 1))});\n        else if (st.level === 1) this.setState({cursor: iso(addDays(monday, 7))});\n        else { const m = parse(st.monthCursor); this.setState({monthCursor: iso(new Date(m.getFullYear(), m.getMonth() + 1, 1))}); } },\n      goToday: () => this.setState({dayCursor: todayIso, cursor: thisMonday, monthCursor: iso(new Date(today.getFullYear(), today.getMonth(), 1))}),\n      resetWeek: () => { const weeks = Object.assign({}, st.weeks); delete weeks[st.cursor]; this.persist({weeks: weeks}); },\n      pct: pctScope.total ? Math.round(pctScope.done / pctScope.total * 100) : 0,\n      doneLabel: pctScope.done + ' of ' + pctScope.total + ' blocks done',\n      legend: ['train','work','study','social','flex'].map(k => ({color: T.cats[k].bd, text: CATNAME[k]})),\n      cats: Object.keys(CATNAME).map(k => ({id: k, name: CATNAME[k]})),\n      courseOptions: st.courses.filter(c => !c.done).map(c => ({id: c.id, name: c.name})),\n      habitCards: habitCards, totals: totals,\n      energyBars: energyBars, energyText: energyText,\n      energyLabel: restDue ? 'Rest day due' : (lowStreak > 0 ? 'Running low' : 'Energy'),\n      energyAvgLabel: energyAvg == null ? '—' : energyAvg + '',\n      energyColor: restDue ? T.warm : (lowStreak > 0 ? T.warm : (energyAvg == null ? T.sb : T.hl)),\n      energyBorder: restDue ? T.warm : T.ln,\n      energyBg: restDue ? 'rgba(' + T.warmRgb + ',0.07)' : T.sf,\n      warningText: warningText, hasWarning: slipping.length > 0,\n      warnLabel: slipping.length ? 'Slipping' : (allClear ? 'Holding' : (nOf('nodata') === n ? 'No data' : 'Mixed')),\n      warnColor: slipping.length ? T.warm : (allClear ? T.hl : T.sb),\n      warnBg: slipping.length ? 'rgba(' + T.warmRgb + ',0.1)' : 'transparent',\n      warnBorder: slipping.length ? T.warm : T.ln,\n      studySummary: loggedH > 0 ? loggedH + ' coursework hours logged this week.' : 'Type hours into any coursework block to log them.',\n      degreeCount: doneCourses + ' / ' + TOTAL_COURSES + ' courses',\n      degreePctLabel: Math.round(doneCourses / TOTAL_COURSES * 100) + '% of the degree',\n      degreeW: Math.round(doneCourses / TOTAL_COURSES * 100) + '%',\n      degreeSummary: doneCourses === 0 ? 'Thirty-nine courses to clear. Rename each one as you enroll and check it off when it\\u2019s passed.' : (TOTAL_COURSES - doneCourses) + ' courses left. Hours logged in the week roll up into whichever course they were for.',\n      pips: st.courses.map((c, i) => ({title: (i+1) + '. ' + c.name + (c.done ? ' — complete' : ''), bg: c.done ? T.hl : T.sf2})),\n      paceLabel: loggedH + (target ? ' / ' + round1(target) : '') + ' hrs',\n      paceNote: !target ? 'no weekly target set' : (loggedH >= target ? 'target met' : round1(target - loggedH) + ' hrs to go'),\n      paceW: (target ? Math.min(100, Math.round(loggedH / target * 100)) : 0) + '%',\n      paceFill: target && loggedH >= target ? T.hl : T.warm,\n      totalHoursLabel: round1(allHours) + ' coursework hours logged all-time',\n      weeklyTarget: st.weeklyTarget,\n      setTarget: e => this.persist({weeklyTarget: e.target.value}),\n      filters: filterDefs.map(f => ({label: f.label, border: st.filter === f.id ? T.hl : T.ln,\n        fg: st.filter === f.id ? T.hl : T.sb, pick: () => this.setState({filter: f.id})})),\n      courseRows: courseRows, completed: completed, hasCompleted: completed.length > 0,\n      completedLabel: completed.length === 1 ? '1 class completed' : completed.length + ' classes completed',\n      todos: st.todos.map((td, i) => ({\n        num: String(i + 1).padStart(2,'0'), text: td.text, detail: td.detail || '',\n        done: !!td.done, op: td.done ? 0.5 : 1, strike: td.done ? 'line-through' : 'none',\n        toggle: () => this.persist({todos: st.todos.map(x => x.id === td.id ? Object.assign({}, x, {done: !x.done}) : x)}),\n        remove: () => this.persist({todos: st.todos.filter(x => x.id !== td.id)})\n      })),\n      draft: st.draft,\n      setDraft: e => this.setState({draft: e.target.value}),\n      addTodo: e => { if (e.key !== 'Enter') return; const v = e.target.value.trim(); if (!v) return;\n        this.persist({todos: st.todos.concat([{id: uid(), text: v, detail: '', done: false}]), draft: ''}); },\n      footer: 'Switch between Day, Week and Month with the tabs; click a date in Month view to open that day. Work is a fixed 9:00–5:00 block and is not tracked. Everything saves to your Firebase account and syncs across your devices.'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
